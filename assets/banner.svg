<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Wave Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="900" height="220" rx="16" fill="url(#bgGradient)" />
  <rect width="900" height="220" rx="16" fill="url(#dotPattern)" />

  <!-- Ambient Glow Circles -->
  <circle cx="820" cy="40" r="140" fill="#0284C7" fill-opacity="0.15" filter="url(#glow)" />
  <circle cx="80" cy="180" r="100" fill="#6366F1" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Tech Wave Graphic Accent -->
  <path d="M0 180 Q 220 140, 450 175 T 900 160 L 900 220 L 0 220 Z" fill="#0284C7" fill-opacity="0.08" />
  <path d="M0 195 Q 280 160, 560 190 T 900 175 L 900 220 L 0 220 Z" fill="#38BDF8" fill-opacity="0.15" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="898" height="218" rx="15" stroke="url(#borderGradient)" stroke-width="1.5" fill="none" />

  <!-- Top Status Badge -->
  <g transform="translate(50, 42)">
    <rect width="186" height="24" rx="12" fill="#0369A1" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="16" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ENGINEERING PORTFOLIO</text>
  </g>

  <!-- Main Name Title -->
  <text x="50" y="112" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Hi there, I'm <tspan fill="url(#accentGradient)">Rahul Poddar</tspan> 👋
  </text>

  <!-- Primary Subtitle -->
  <text x="50" y="148" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">
    Backend &amp; Systems Engineer <tspan fill="#38BDF8">•</tspan> Knowledge Graphs (Neo4j) <tspan fill="#38BDF8">•</tspan> Multi-Agent AI
  </text>

  <!-- Bottom Key Focus Accent -->
  <text x="50" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
    C++ DSA <tspan fill="#475569">|</tspan> Node.js &amp; TypeScript <tspan fill="#475569">|</tspan> GraphRAG Deterministic Clinical Safety <tspan fill="#475569">|</tspan> PostgreSQL
  </text>

  <!-- Right Decorative Geometric Node Cluster (Graph Representation) -->
  <g transform="translate(730, 75)" opacity="0.85">
    <!-- Graph Links -->
    <line x1="40" y1="20" x2="100" y2="35" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3" />
    <line x1="40" y1="20" x2="60" y2="85" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="100" y1="35" x2="60" y2="85" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="100" y1="35" x2="120" y2="80" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="2 2" />

    <!-- Graph Nodes -->
    <circle cx="40" cy="20" r="14" fill="#0B132B" stroke="#38BDF8" stroke-width="2" />
    <text x="40" y="24" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">KG</text>

    <circle cx="100" cy="35" r="16" fill="#0B132B" stroke="#818CF8" stroke-width="2" />
    <text x="100" y="39" fill="#818CF8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">RAG</text>

    <circle cx="60" cy="85" r="12" fill="#0B132B" stroke="#0284C7" stroke-width="2" />
    <text x="60" y="89" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">AI</text>

    <circle cx="120" cy="80" r="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />
  </g>
</svg>
